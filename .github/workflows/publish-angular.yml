name: Publish Angular package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Angular package version bump
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - run: npm ci
        working-directory: angular
      - name: Bump Angular version
        run: npm version "${{ inputs.version_bump }}" --no-git-tag-version
        working-directory: angular/projects/ng-circular-slider
      - run: npm run build
        working-directory: angular
      - run: npm test
        working-directory: angular
      - name: Publish Angular library
        run: npm publish ./dist/ng-circular-slider --access public --provenance
        working-directory: angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Commit released version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add angular/projects/ng-circular-slider/package.json
          git commit -m "Release Angular circular slider"
          git push
