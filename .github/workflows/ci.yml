name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Angular workspace dependencies
        run: npm --prefix angular ci

      - name: Build library
        run: npm run build

      - name: Build Angular library
        run: npm --prefix angular run build

      - name: Install Angular 22 demo dependencies
        if: matrix.node-version != 20
        run: npm --prefix angular/demo ci

      - name: Install Vue demo dependencies
        if: matrix.node-version != 20
        run: npm --prefix vue ci

      - name: Install Web Component demo dependencies
        if: matrix.node-version != 20
        run: npm --prefix web-component ci

      - name: Build demos
        if: matrix.node-version != 20
        run: npm run build-demo

      - name: Build React demo on Node 20
        if: matrix.node-version == 20
        run: npm run build-demo:react

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check Angular behavior and server rendering
        run: npm --prefix angular test

      - name: Check shared slider geometry
        run: npm run test:shared

      - name: Check framework README links and examples
        run: npm run test:docs

      - name: Install layout-test browser
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium

      - name: Check value centering across frameworks
        if: matrix.node-version == 24
        run: npm run test:layout

  angular-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - run: npm ci
        working-directory: angular
      - run: npm run build
        working-directory: angular
      - run: npm ci
        working-directory: angular/demo
      - run: npx playwright install --with-deps chromium
        working-directory: angular
      - run: npm run test:browser
        working-directory: angular

  angular-consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        angular-version: [21, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - run: npm ci
        working-directory: angular
      - run: npm run build
        working-directory: angular
      - run: npx playwright install --with-deps chromium
        if: matrix.angular-version == 22
        working-directory: angular
      - run: npm run test:consumer -- ${{ matrix.angular-version }} --browser
        working-directory: angular

  framework-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vue/package-lock.json
            web-component/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: vue
      - run: npm ci
        working-directory: web-component
      - run: npm run build:vue
      - run: npm run build:web-component
      - run: npm run typecheck
        working-directory: vue
      - run: npm run typecheck
        working-directory: web-component
      - run: npm test
        working-directory: vue
      - run: npm test
        working-directory: web-component
      - run: npx playwright install --with-deps chromium
      - run: npm run test:frameworks
      - run: npm run test:consumers -- --browser
